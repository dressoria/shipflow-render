name: SendiFlash direct-carrier checks

on:
  pull_request:
    paths:
      - 'shipflow-web/**'
      - '.github/workflows/direct-carriers-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shipflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shipflow-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
